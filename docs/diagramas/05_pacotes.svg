xt><text x="64" y="722.0" font-family="Nunito" font-size="15" font-weight="600" fill="#1B1F4A" text-anchor="start">• Camadas separadas: api ➜ servico ➜ motor e dao ➜ banco. O motor não importa nada do dao.</text><text x="64" y="742.25" font-family="Nunito" font-size="15" font-weight="600" fill="#1B1F4A" text-anchor="start">• DAO com JDBC: todo comando com dado do usuário usa PreparedStatement com parâmetros (?).</text><text x="64" y="762.5" font-family="Nunito" font-size="15" font-weight="600" fill="#1B1F4A" text-anchor="start">• Records e enums no modelo (Relacao, Destino), herança em BaseDAO, encapsulamento na Sessao.</text></svg>