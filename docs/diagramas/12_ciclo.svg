<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430"><rect x="0" y="0" width="1240" height="430" rx="22" fill="#FFFFFF"/><text x="40" y="52" font-family="Fredoka" font-size="28" font-weight="600" fill="#1B1F4A" text-anchor="start">Como cada rodada funcionou</text><text x="40" y="80" font-family="Nunito" font-size="16" font-weight="700" fill="#454A78" text-anchor="start">Ciclos curtos. Nenhuma mudança fica se o portão de segurança não passar.</text><rect x="40" y="130" width="210" height="150" rx="20" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="145" y="175" font-family="Fredoka" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Backlog</text><text x="145" y="210" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">problemas achados nas</text><text x="145" y="232" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">conversas simuladas</text><path d="M252 205 L278 205" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M278 205 L268.1 209.8 L268.1 200.2 z" fill="#454A78"/><rect x="280" y="130" width="210" height="150" rx="20" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="385" y="175" font-family="Fredoka" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Mudança</text><text x="385" y="210" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">uma de cada vez,</text><text x="385" y="232" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">no motor ou na base</text><path d="M492 205 L518 205" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M518 205 L508.1 209.8 L508.1 200.2 z" fill="#454A78"/><rect x="520" y="130" width="210" height="150" rx="20" fill="#D63B40" stroke="#D63B40" stroke-width="2" opacity="1"/><text x="625" y="175" font-family="Fredoka" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Portão</text><text x="625" y="210" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">10.000 casos + 8 testes;</text><text x="625" y="232" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">sensibilidade ≥ 99,5%</text><path d="M732 205 L758 205" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M758 205 L748.1 209.8 L748.1 200.2 z" fill="#454A78"/><rect x="760" y="130" width="210" height="150" rx="20" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="865" y="175" font-family="Fredoka" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Medição</text><text x="865" y="210" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">nota, perguntas,</text><text x="865" y="232" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">itens sem relação</text><path d="M972 205 L998 205" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M998 205 L988.1 209.8 L988.1 200.2 z" fill="#454A78"/><rect x="1000" y="130" width="210" height="150" rx="20" fill="#2B3290" stroke="#2B3290" stroke-width="2" opacity="1"/><text x="1105" y="175" font-family="Fredoka" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Decisão</text><text x="1105" y="210" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">fica ou é desfeita</text><text x="1105" y="232" font-family="Nunito" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">(e vai para a tabela)</text><path d="M1150 282 Q645 400 140 282" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M140 282 L150.7 279.6 L148.6 288.9 z" fill="#454A78"/><rect x="565.4" y="386" width="159.20000000000002" height="24" rx="9" fill="#FFFFFF" stroke="#E3E6FB" stroke-width="1.5" opacity="1"/><text x="645" y="404" font-family="Nunito" font-size="12" font-weight="700" fill="#454A78" text-anchor="middle">próxima volta do ciclo</text></svg>