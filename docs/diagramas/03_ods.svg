<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="360" viewBox="0 0 1240 360"><rect x="0" y="0" width="1240" height="360" rx="22" fill="#FFFFFF"/><rect x="30" y="20" width="280" height="320" rx="22" fill="#FFFFFF" stroke="#E3E6FB" stroke-width="2" opacity="1"/><path d="M30 42 a22 22 0 0 1 22 -22 h236 a22 22 0 0 1 22 22 v108 h-280 z" fill="#4C9F38"/><text x="54" y="104" font-family="Fredoka" font-size="64" font-weight="700" fill="#fff" text-anchor="start">3</text><text x="104" y="70" font-family="Nunito" font-size="16" font-weight="800" fill="#fff" text-anchor="start">ODS</text><text x="104" y="96.0" font-family="Fredoka" font-size="16" font-weight="600" fill="#fff" text-anchor="start">Saúde</text><text x="104" y="117.6" font-family="Fredoka" font-size="16" font-weight="600" fill="#fff" text-anchor="start">e bem-estar</text><text x="54" y="196.0" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">Orienta para o lugar certo</text><text x="54" y="220.65" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">na hora certa e reconhece</text><text x="54" y="245.3" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">sinais de emergência.</text><rect x="330" y="20" width="280" height="320" rx="22" fill="#FFFFFF" stroke="#E3E6FB" stroke-width="2" opacity="1"/><path d="M330 42 a22 22 0 0 1 22 -22 h236 a22 22 0 0 1 22 22 v108 h-280 z" fill="#DD1367"/><text x="354" y="104" font-family="Fredoka" font-size="64" font-weight="700" fill="#fff" text-anchor="start">10</text><text x="442" y="70" font-family="Nunito" font-size="16" font-weight="800" fill="#fff" text-anchor="start">ODS</text><text x="442" y="96.0" font-family="Fredoka" font-size="16" font-weight="600" fill="#fff" text-anchor="start">Redução</text><text x="442" y="117.6" font-family="Fredoka" font-size="16" font-weight="600" fill="#fff" text-anchor="start">das desigualdades</text><text x="354" y="196.0" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">Grátis, no celular, sem</text><text x="354" y="220.65" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">plano de saúde e em</text><text x="354" y="245.3" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">linguagem simples.</text><rect x="630" y="20" width="280" height="320" rx="22" fill="#FFFFFF" stroke="#E3E6FB" stroke-width="2" opacity="1"/><path d="M630 42 a22 22 0 0 1 22 -22 h236 a22 22 0 0 1 22 22 v108 h-280 z" fill="#FD9D24"/><text x="654" y="104" font-family="Fredoka" font-size="64" font-weight="700" fill="#fff" text-anchor="start">11</text><text x="742" y="70" font-family="Nunito" font-size="16" font-weight="800" fill="#fff" text-anchor="start">ODS</text><text x="742" y="96.0" font-family="Fredoka" font-size="16" font-weight="600" fill="#fff" text-anchor="start">Cidades</text><text x="742" y="117.6" font-family="Fredoka" font-size="16" font-weight="600" fill="#fff" text-anchor="start">sustentáveis</text><text x="654" y="196.0" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">Menos casos leves na UPA</text><text x="654" y="220.65" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">deixa a rede livre para</text><text x="654" y="245.3" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">quem é urgente.</text><rect x="930" y="20" width="280" height="320" rx="22" fill="#FFFFFF" stroke="#E3E6FB" stroke-width="2" opacity="1"/><path d="M930 42 a22 22 0 0 1 22 -22 h236 a22 22 0 0 1 22 22 v108 h-280 z" fill="#FD6925"/><text x="954" y="104" font-family="Fredoka" font-size="64" font-weight="700" fill="#fff" text-anchor="start">9</text><text x="1004" y="70" font-family="Nunito" font-size="16" font-weight="800" fill="#fff" text-anchor="start">ODS</text><text x="1004" y="96.0" font-family="Fredoka" font-size="16" font-weight="600" fill="#fff" text-anchor="start">Inovação</text><text x="1004" y="117.6" font-family="Fredoka" font-size="16" font-weight="600" fill="#fff" text-anchor="start">e infraestrutura</text><text x="954" y="196.0" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">Motor auditável, base</text><text x="954" y="220.65" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">aberta com fonte e testes</text><text x="954" y="245.3" font-family="Nunito" font-size="17" font-weight="700" fill="#1B1F4A" text-anchor="start">antes de usar com gente.</text></svg>