<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900"><rect x="0" y="0" width="1240" height="900" rx="22" fill="#FFFFFF"/><text x="40" y="52" font-family="Fredoka" font-size="28" font-weight="600" fill="#1B1F4A" text-anchor="start">Fluxo de uma conversa</text><text x="40" y="80" font-family="Nunito" font-size="16" font-weight="700" fill="#454A78" text-anchor="start">Cada caixa é uma tela. A Tami pergunta só o que muda o destino.</text><rect x="40" y="110" width="230" height="90" rx="18" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="155.0" y="140" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Entrada</text><text x="155.0" y="164.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">com conta ou sem conta</text><rect x="320" y="110" width="230" height="90" rx="18" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="435.0" y="140" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Combinado</text><text x="435.0" y="164.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">termos do teste e</text><text x="435.0" y="181.55" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">consentimento de saúde</text><rect x="600" y="110" width="230" height="90" rx="18" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="715.0" y="140" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Para quem?</text><text x="715.0" y="164.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">eu, outra pessoa, criança</text><text x="715.0" y="181.55" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">idade, gravidez, diabetes</text><rect x="880" y="110" width="320" height="90" rx="18" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="1040.0" y="140" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Conta do seu jeito</text><text x="1040.0" y="164.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">relato livre e, se quiser,</text><text x="1040.0" y="181.55" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">toca no corpo (Onde dói?)</text><path d="M270 155 L318 155" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M318 155 L308.1 159.8 L308.1 150.2 z" fill="#454A78"/><path d="M550 155 L598 155" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M598 155 L588.1 159.8 L588.1 150.2 z" fill="#454A78"/><path d="M830 155 L878 155" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M878 155 L868.1 159.8 L868.1 150.2 z" fill="#454A78"/><rect x="400" y="250" width="440" height="90" rx="18" fill="#2B3290" stroke="#2B3290" stroke-width="2" opacity="1"/><text x="620.0" y="280" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">O motor lê o relato</text><text x="620.0" y="304.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">normaliza, acha a parte do corpo, sinais de</text><text x="620.0" y="321.55" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">alerta, risco de crise e o que já foi respondido</text><path d="M1040 200 Q1040 270 842 280" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M842 280 L851.7 274.7 L852.1 284.3 z" fill="#454A78"/><rect x="40" y="250" width="300" height="90" rx="18" fill="#7A1F5C" stroke="#7A1F5C" stroke-width="2" opacity="1"/><text x="190.0" y="280" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Risco de suicídio?</text><text x="190.0" y="304.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">mostra CVV 188</text><text x="190.0" y="321.55" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">em qualquer ponto</text><path d="M400 295 L342 295" fill="none" stroke="#7A1F5C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/><path d="M342 295 L351.9 290.2 L351.9 299.8 z" fill="#7A1F5C"/><rect x="400" y="390" width="440" height="90" rx="18" fill="#D63B40" stroke="#D63B40" stroke-width="2" opacity="1"/><text x="620.0" y="420" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tela de emergência (FIL_EM)</text><text x="620.0" y="444.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">um item grave marcado ou &quot;Não sei&quot;</text><text x="620.0" y="461.55" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">em pergunta de alarme ➜ SAMU 192</text><path d="M620 340 L620 388" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M620 388 L615.2 378.1 L624.8 378.1 z" fill="#454A78"/><rect x="60" y="540" width="145" height="70" rx="14" fill="#EEF0FF" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="132" y="568" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#3F4ACB" text-anchor="middle">LES</text><text x="132" y="592" font-family="Nunito" font-size="13" font-weight="700" fill="#454A78" text-anchor="middle">machucado</text><path d="M620 480 L132 538" fill="none" stroke="#454A78" stroke-width="2" stroke-linecap="round"/><path d="M132 538 L141.3 532.1 L142.4 541.6 z" fill="#454A78"/><rect x="222" y="540" width="145" height="70" rx="14" fill="#EEF0FF" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="294" y="568" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#3F4ACB" text-anchor="middle">URI</text><text x="294" y="592" font-family="Nunito" font-size="13" font-weight="700" fill="#454A78" text-anchor="middle">urina</text><path d="M620 480 L294 538" fill="none" stroke="#E3E6FB" stroke-width="2" stroke-linecap="round"/><path d="M294 538 L302.9 531.6 L304.6 541.0 z" fill="#E3E6FB"/><rect x="384" y="540" width="145" height="70" rx="14" fill="#EEF0FF" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="456" y="568" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#3F4ACB" text-anchor="middle">PEL</text><text x="456" y="592" font-family="Nunito" font-size="13" font-weight="700" fill="#454A78" text-anchor="middle">pele</text><path d="M620 480 L456 538" fill="none" stroke="#E3E6FB" stroke-width="2" stroke-linecap="round"/><path d="M456 538 L463.7 530.2 L466.9 539.2 z" fill="#E3E6FB"/><rect x="546" y="540" width="145" height="70" rx="14" fill="#EEF0FF" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="618" y="568" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#3F4ACB" text-anchor="middle">BAR</text><text x="618" y="592" font-family="Nunito" font-size="13" font-weight="700" fill="#454A78" text-anchor="middle">barriga</text><path d="M620 480 L618 538" fill="none" stroke="#E3E6FB" stroke-width="2" stroke-linecap="round"/><path d="M618 538 L613.6 527.9 L623.1 528.3 z" fill="#E3E6FB"/><rect x="708" y="540" width="145" height="70" rx="14" fill="#EEF0FF" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="780" y="568" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#3F4ACB" text-anchor="middle">MEN</text><text x="780" y="592" font-family="Nunito" font-size="13" font-weight="700" fill="#454A78" text-anchor="middle">saúde mental</text><path d="M620 480 L780 538" fill="none" stroke="#E3E6FB" stroke-width="2" stroke-linecap="round"/><path d="M780 538 L769.1 539.1 L772.3 530.1 z" fill="#E3E6FB"/><rect x="870" y="540" width="145" height="70" rx="14" fill="#EEF0FF" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="942" y="568" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#3F4ACB" text-anchor="middle">FEB</text><text x="942" y="592" font-family="Nunito" font-size="13" font-weight="700" fill="#454A78" text-anchor="middle">febre</text><path d="M620 480 L942 538" fill="none" stroke="#E3E6FB" stroke-width="2" stroke-linecap="round"/><path d="M942 538 L931.4 541.0 L933.1 531.5 z" fill="#E3E6FB"/><rect x="1032" y="540" width="145" height="70" rx="14" fill="#EEF0FF" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="1104" y="568" font-family="JetBrains Mono" font-size="18" font-weight="700" fill="#3F4ACB" text-anchor="middle">GEN</text><text x="1104" y="592" font-family="Nunito" font-size="13" font-weight="700" fill="#454A78" text-anchor="middle">geral</text><path d="M620 480 L1104 538" fill="none" stroke="#454A78" stroke-width="2" stroke-linecap="round"/><path d="M1104 538 L1093.6 541.6 L1094.7 532.1 z" fill="#454A78"/><text x="1200" y="430" font-family="Nunito" font-size="14" font-weight="700" fill="#454A78" text-anchor="end">Sem emergência, o motor</text><text x="1200" y="450" font-family="Nunito" font-size="14" font-weight="700" fill="#454A78" text-anchor="end">escolhe a trilha pelo relato ➜</text><rect x="240" y="650" width="360" height="90" rx="18" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="420.0" y="680" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lista curta de confirmação</text><text x="420.0" y="704.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">até 5 itens; página 2 só se a 1ª tinha</text><text x="420.0" y="721.55" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">item grave e a pessoa marcou Nenhum</text><rect x="640" y="650" width="360" height="90" rx="18" fill="#3F4ACB" stroke="#3F4ACB" stroke-width="2" opacity="1"/><text x="820.0" y="680" font-family="Fredoka" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Poucas perguntas</text><text x="820.0" y="704.0" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">dor de 0 a 10 com rostos, há quanto</text><text x="820.0" y="721.55" font-family="Nunito" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">tempo; mediana de 6 por caso</text><path d="M620 610 Q450 620 420 648" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M420 648 L424.0 637.7 L430.5 644.7 z" fill="#454A78"/><path d="M600 695 L638 695" fill="none" stroke="#454A78" stroke-width="2.5" stroke-linecap="round"/><path d="M638 695 L628.1 699.8 L628.1 690.2 z" fill="#454A78"/><rect x="70" y="790" width="250" height="70" rx="18" fill="#D63B40" stroke="#D63B40" stroke-width="2" opacity="1"/><text x="195" y="832" font-family="Fredoka" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">SAMU 192 agora</text><path d="M820 740 L195 788" fill="none" stroke="#454A78" stroke-width="2" stroke-linecap="round"/><path d="M195 788 L204.5 782.5 L205.2 792.0 z" fill="#454A78"/><rect x="355" y="790" width="250" height="70" rx="18" fill="#F79009" stroke="#F79009" stroke-width="2" opacity="1"/><text x="480" y="832" font-family="Fredoka" font-size="19" font-weight="600" fill="#1B1F4A" text-anchor="middle">UPA hoje</text><path d="M820 740 L480 788" fill="none" stroke="#454A78" stroke-width="2" stroke-linecap="round"/><path d="M480 788 L489.1 781.9 L490.5 791.4 z" fill="#454A78"/><rect x="640" y="790" width="250" height="70" rx="18" fill="#7CC4F2" stroke="#7CC4F2" stroke-width="2" opacity="1"/><text x="765" y="832" font-family="Fredoka" font-size="19" font-weight="600" fill="#1B1F4A" text-anchor="middle">UBS em breve</text><path d="M820 740 L765 788" fill="none" stroke="#454A78" stroke-width="2" stroke-linecap="round"/><path d="M765 788 L769.3 777.9 L775.6 785.1 z" fill="#454A78"/><rect x="925" y="790" width="250" height="70" rx="18" fill="#B7EBC8" stroke="#B7EBC8" stroke-width="2" opacity="1"/><text x="1050" y="832" font-family="Fredoka" font-size="19" font-weight="600" fill="#1B1F4A" text-anchor="middle">Cuidar em casa</text><path d="M820 740 L1050 788" fill="none" stroke="#454A78" stroke-width="2" stroke-linecap="round"/><path d="M1050 788 L1039.3 790.7 L1041.3 781.3 z" fill="#454A78"/><path d="M398 450 Q30 470 195 788" fill="none" stroke="#D63B40" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><path d="M195 788 L186.2 781.4 L194.7 777.0 z" fill="#D63B40"/><text x="1200" y="885" font-family="Nunito" font-size="14" font-weight="700" fill="#454A78" text-anchor="end">Todo destino vem com o que fazer até lá e quando procurar ajuda antes.</text></svg>